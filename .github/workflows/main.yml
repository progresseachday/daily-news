name: Daily Wall Street & Tech Summary

on:
  schedule:
    # ⏰ 台灣時間清晨 05:43（避開 06:00 整點大塞車的冷門時段鬧鐘）
    - cron: '43 21 * * *'
  workflow_dispatch: # 允許手動一鍵測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 🚀 1. 下載程式碼
      uses: actions/checkout@v4

    - name: 🐍 2. 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 3. 安裝 requirements.txt 內指定的標準套件
      run: |
        pip install -r requirements.txt

    - name: 🤖 4. 執行腳本並寄信
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python main.py
