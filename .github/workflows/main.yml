name: Daily Wall Street & Tech Summary

on:
  schedule:
    - cron: '0 22 * * *' # 每天國際時間 22:00（等於台灣時間早上 06:00 AM 自動送達）
  workflow_dispatch: # 保留此項：允許隨時點擊按鈕手動測試

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-packages: 'requests'

    - name: 執行情報收集與寄信
      env:
        GMAIL_USER: ${{ secrets.GMAIL_USER }}
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python main.py
